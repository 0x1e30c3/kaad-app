# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: kadd-indexer
description: Every trade, club, strategy and copy vault on Kadd (Monad testnet), plus realized PnL of every Perpl perps trader (Monad mainnet).
field_selection:
  transaction_fields:
    - hash
contracts:
  # Opens one mirror pool per mainnet token; each new pool is registered for indexing.
  - name: KaddVenue
    events:
      - event: MirrorCreated(address indexed source, address indexed pool, address token, string symbol)
  - name: KaddPool
    events:
      - event: Swap(address indexed trader, bool isBuy, uint256 amountIn, uint256 amountOut)
  # Creates clubs; each new club is registered for indexing.
  - name: KaddClubFactory
    events:
      - event: ClubCreated(address indexed club, address indexed captain, string name)
  - name: KaddClub
    events:
      - event: Deposited(address indexed member, uint256 amount, uint256 shares)
      - event: Redeemed(address indexed member, uint256 shares)
  - name: KaddStrategies
    events:
      - event: Created(uint256 indexed id, address indexed owner, address indexed pool, bool isBuy, uint256 amount)
      - event: Executed(uint256 indexed id, address indexed executor, uint256 amountIn, uint256 amountOut, uint256 price)
      - event: Cancelled(uint256 indexed id, uint256 refunded)
  - name: KaddCopy
    events:
      - event: Followed(uint256 indexed id, address indexed owner, address indexed leader, uint256 perTrade, uint256 dailyCap, bool copySells, uint256 deposit)
      - event: Funded(uint256 indexed id, uint256 amount)
      - event: Copied(uint256 indexed id, bytes32 indexed leaderTx, address indexed pool, bool isBuy, uint256 amountIn, uint256 amountOut)
      - event: Closed(uint256 indexed id, uint256 cash)
  # Copy clubs: friends pool tUSDC into one vault that auto-copies a mainnet wallet.
  - name: KaddCopyClubs
    events:
      - event: ClubCreated(uint256 indexed id, address indexed creator, address indexed leader, string name, uint256 perTradeBps, uint256 dailyCapBps, bool copySells)
      - event: Deposited(uint256 indexed id, address indexed member, uint256 amount, uint256 shares)
      - event: Redeemed(uint256 indexed id, address indexed member, uint256 shares, uint256 cash)
      - event: Copied(uint256 indexed id, bytes32 indexed leaderTx, address indexed pool, bool isBuy, uint256 amountIn, uint256 amountOut)
  # Perpl perpetual futures (Monad mainnet): realized PnL per trader from closes, partial closes and liquidations.
  - name: PerplExchange
    events:
      - event: AccountCreated(address account, uint256 id)
      - event: PositionClosed(uint256 perpId, uint256 accountId, uint8 positionType, uint256 pricePNS, int256 deltaPnlCNS, int256 fundingCNS)
      - event: PositionDecreased(uint256 perpId, uint256 accountId, uint8 positionType, uint256 startDepositCNS, uint256 endDepositCNS, uint256 startLotLNS, uint256 endLotLNS, int256 deltaPnlCNS, int256 fundingCNS)
      - event: PositionLiquidated(uint256 perpId, uint256 posAccountId, uint8 positionType, uint256 markPricePNS, uint256 liqPricePNS, uint256 liqLotLNS, uint256 posLotLNS, int256 deltaPnlCNS, int256 fundingCNS, int256 posAmountCNS, uint256 posDepositCNS, int256 accAmountCNS, uint256 accBalanceCNS, bool onOrderBook)
      - event: PositionInverted(uint256 perpId, uint256 accountId, uint8 positionType, uint256 leverageHdths, uint256 startDepositCNS, uint256 endDepositCNS, int256 pnlCollateralizedCNS, uint256 pricePNS, uint256 startLotLNS, uint256 endLotLNS, int256 deltaPnlCNS, int256 fundingCNS, uint256 insFeeCNS, uint256 protFeeCNS)
chains:
  - id: 10143 # Monad testnet
    start_block: 67481453 # KaddVenue deployment
    contracts:
      - name: KaddVenue
        address: 0xe4c0c88a4b2e5b150D3bB8D3d391E6A87b3d5379
      - name: KaddClubFactory
        address: 0x4E24bA0762624EAa63E02f3834105efa423A624c
      - name: KaddStrategies
        address: 0xC12684b7063e3C749f0227539601a7b370073cEA
      - name: KaddCopy
        address: 0x27bB7D06AF7BA8Ea359CFe00A628145ED0Bf1661
      - name: KaddCopyClubs
        address: 0x67A974949d2918e07763C86cfe8bbc3E817930D2
  - id: 143 # Monad mainnet
    start_block: 54972991 # Perpl Exchange's first account
    contracts:
      - name: PerplExchange
        address: 0x34B6552d57a35a1D042CcAe1951BD1C370112a6F
