# Kadd on Monad testnet. Amounts in USD are tUSDC (1 tUSDC = $1 on testnet); token amounts are whole tokens.

# A mirror pool: one per mainnet token, opened at its mainnet price.
type Pool {
  id: ID! # pool address
  source: String! # mainnet token it mirrors
  token: String! # testnet mirror token
  symbol: String!
  createdAt: Int!
  trades: Int!
  buys: Int!
  sells: Int!
  volumeUsd: Float!
  lastPriceUsd: Float!
}

# One swap on a Kadd pool, attributed to whoever's money it was: the wallet itself, a club, or the owner of the
# strategy / copy vault that made it ("kind" says which).
type Swap {
  id: ID! # chainId_block_logIndex
  pool: String!
  trader: String!
  kind: String! # wallet | club | strategy | copy | copyclub
  isBuy: Boolean!
  usd: Float!
  tokens: Float!
  priceUsd: Float!
  timestamp: Int!
  block: Int!
  txHash: String! @index
}

# Running totals per account (wallets and clubs) — what the leaderboard ranks.
type Trader {
  id: ID! # address
  kind: String! # wallet | club
  trades: Int!
  buys: Int!
  sells: Int!
  volumeUsd: Float!
  boughtUsd: Float!
  soldUsd: Float!
  viaStrategies: Int!
  viaCopy: Int!
  firstAt: Int!
  lastAt: Int!
}

# Network activity per UTC day — the Stats page's time series.
type DailyStat {
  id: ID! # day number (unix seconds / 86400)
  day: Int!
  trades: Int!
  volumeUsd: Float!
  newTraders: Int!
  clubDeposits: Int!
  depositedUsd: Float!
  copies: Int!
  strategiesCreated: Int!
}

type Club {
  id: ID! # club address
  name: String!
  captain: String!
  createdAt: Int!
  deposits: Int!
  depositedUsd: Float!
  redemptions: Int!
  trades: Int!
  volumeUsd: Float!
}

type ClubDeposit {
  id: ID!
  club: String! @index
  member: String! @index
  usd: Float!
  shares: BigInt!
  timestamp: Int!
}

type Strategy {
  id: ID! # strategy id
  owner: String! @index
  pool: String!
  isBuy: Boolean!
  amount: BigInt!
  executions: Int!
  cancelled: Boolean!
  createdAt: Int!
}

type CopyVault {
  id: ID! # vault id
  owner: String! @index
  leader: String! @index
  perTradeUsd: Float!
  dailyCapUsd: Float!
  depositedUsd: Float!
  copySells: Boolean!
  copies: Int!
  active: Boolean!
  createdAt: Int!
}

type CopyTrade {
  id: ID!
  vault: String! @index # KaddCopy vault id, or "club:<id>" for a copy club
  leaderTx: String!
  pool: String!
  isBuy: Boolean!
  usd: Float!
  timestamp: Int!
  txHash: String!
}

# A copy club (KaddCopyClubs): many members, one vault that auto-copies `leader`. Rules are a share of the club's cash.
type CopyClub {
  id: ID! # club id
  name: String!
  creator: String! @index
  leader: String! @index
  perTradeBps: Int!
  dailyCapBps: Int!
  copySells: Boolean!
  members: Int! # wallets holding shares now
  totalShares: BigInt!
  deposits: Int!
  depositedUsd: Float!
  redemptions: Int!
  redeemedCashUsd: Float! # cash paid out on redeem (tokens are paid out in kind on top)
  copies: Int!
  createdAt: Int!
}

type CopyClubMember {
  id: ID! # clubId_member
  club: String! @index
  member: String! @index
  shares: BigInt!
  depositedUsd: Float!
}

# Lookup from a transaction to the swap it contained, so the strategy / copy event that follows the swap in the
# same transaction can re-attribute it to the owner of the funds.
type TxSwap {
  id: ID! # transaction hash
  swap: String!
}
